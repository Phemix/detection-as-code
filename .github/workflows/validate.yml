name: Detection-as-Code Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'rules/**'
      - 'sigma_config.yml'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'rules/**'
      - 'sigma_config.yml'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      validate_all:
        description: 'Validate all rules (not just changed)'
        required: false
        default: 'false'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    name: Validate Rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get changed rule files (PR only)
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'rules/**/*.yml')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Validate changed rules (PR)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED="${{ steps.changed.outputs.files }}"
          if [ -z "$CHANGED" ]; then echo "No rule files changed."; exit 0; fi
          FAILED=0
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "Validating: $file"
              python scripts/validate.py --file "$file" || FAILED=1
            fi
          done <<< "$CHANGED"
          exit $FAILED

      - name: Validate all rules (push to main or manual)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/validate.py

      - name: Check rule journal updated (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          python scripts/check_journal_updated.py --base origin/${{ github.base_ref }}

      - name: Run rule tests (PR — changed rules only)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED="${{ steps.changed.outputs.files }}"
          if [ -z "$CHANGED" ]; then echo "No rule files changed."; exit 0; fi
          FAILED=0
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              RULE_ID=$(python3 -c "import yaml; r=yaml.safe_load(open('$file')); print(r.get('id',''))" 2>/dev/null)
              if [ -n "$RULE_ID" ]; then
                echo "Testing: $file ($RULE_ID)"
                python scripts/test_rules.py --rule "$RULE_ID" || FAILED=1
              fi
            fi
          done <<< "$CHANGED"
          exit $FAILED

      - name: Run rule tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/test_rules.py

      - name: Check promotion staleness
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/check_staleness.py --days 30

      - name: Score rules
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/score.py --threshold 60

      - name: Capture validation errors
        if: failure()
        run: |
          python scripts/validate.py 2>&1 | tail -50 > /tmp/validate_errors.txt || true
          python scripts/test_rules.py 2>&1 | tail -50 >> /tmp/validate_errors.txt || true

      - name: Upload validation error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: validate-errors
          path: /tmp/validate_errors.txt
          if-no-files-found: ignore

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation_report.json
          if-no-files-found: ignore

  compile:
    name: Compile to Splunk SPL
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get changed rule files (PR only)
        if: github.event_name == 'pull_request'
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'rules/**/*.yml')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Compile changed rules (PR)
        if: github.event_name == 'pull_request'
        run: |
          CHANGED="${{ steps.changed.outputs.files }}"
          if [ -z "$CHANGED" ]; then echo "No rule files changed."; exit 0; fi
          FAILED=0
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              echo "Compiling: $file"
              python scripts/compile.py --backend splunk --file "$(pwd)/$file" || FAILED=1
            fi
          done <<< "$CHANGED"
          exit $FAILED

      - name: Compile all rules (push to main or manual)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/compile.py --backend splunk

      - name: Capture compile errors
        if: failure()
        run: |
          python scripts/compile.py --backend splunk 2>&1 | tail -50 > /tmp/compile_errors.txt || true
          python scripts/compile.py --backend sentinel 2>&1 | tail -50 >> /tmp/compile_errors.txt || true

      - name: Upload compile error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-errors
          path: /tmp/compile_errors.txt
          if-no-files-found: ignore

      - name: Upload compiled rules
        uses: actions/upload-artifact@v4
        with:
          name: compiled-splunk
          path: compiled/splunk/
          if-no-files-found: ignore

  inventory:
    name: Update Rule Inventory
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate inventory
        run: |
          python scripts/inventory.py --output RULES.md
          python scripts/inventory.py --json --output rules_manifest.json

      - name: Commit inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RULES.md rules_manifest.json
          git diff --staged --quiet || git commit -m "chore: update rule inventory [skip ci]"
          git push

  pr-comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [validate, compile]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get changed rules
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'rules/**/*.yml')
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate PR comment
        run: |
          python - <<'PYEOF'
          import yaml, re
          from pathlib import Path
          changed = """${{ steps.changed.outputs.files }}""".strip().split('\n')
          changed = [f for f in changed if f.strip()]
          lines = ["## Detection Rule Review\n"]
          lines.append(f"**{len(changed)} rule(s) changed in this PR**\n")
          if changed:
              lines.append("| ID | Title | Type | Level | MITRE |")
              lines.append("|----|-------|------|-------|-------|")
              for f in changed:
                  p = Path(f)
                  if p.exists() and p.suffix == '.yml':
                      try:
                          rule = yaml.safe_load(p.read_text())
                          rid = rule.get('id', '—')
                          title = rule.get('title') or rule.get('name', '—')
                          level = rule.get('level') or rule.get('severity', '—')
                          rtype = rule.get('type', 'detection')
                          mitre_field = rule.get('mitre', [])
                          mitre = ', '.join(str(t) for t in mitre_field) if mitre_field else '—'
                          lines.append(f"| `{rid}` | {title} | {rtype} | {level} | {mitre} |")
                      except Exception:
                          lines.append(f"| — | `{p.name}` | (parse error) | — | — |")
          lines.append("\n> Validation and compilation ran against changed rules only.")
          lines.append("> Full validation runs on merge to main.")
          Path('pr_comment.txt').write_text('\n'.join(lines))
          PYEOF

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr_comment.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  deploy:
    name: Deploy to Splunk
    runs-on: self-hosted
    needs: [validate, compile]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up venv and install dependencies
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: Compile rules
        run: |
          source .venv/bin/activate
          python scripts/compile.py --backend splunk

      - name: Deploy to Splunk
        env:
          SPLUNK_PASSWORD: ${{ secrets.SPLUNK_PASSWORD }}
        run: |
          source .venv/bin/activate
          python scripts/deploy_splunk.py \
            --host localhost \
            --port 8089 \
            --user admin \
            --password "$SPLUNK_PASSWORD" \
            --app search

      - name: Notify deploy success
        if: github.ref == 'refs/heads/main' && success()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          RULE_COUNT=$(find rules/ -name "*.yml" | wc -l | tr -d ' ')
          python3 scripts/notify.py \
            --event deploy \
            --status success \
            --rules "$RULE_COUNT" \
            --branch ${{ github.ref_name }} \
            --commit ${{ github.sha }}

      - name: Notify on failure
        if: github.ref == 'refs/heads/main' && failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          REPO_NAME: ${{ github.repository }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/notify.py \
            --event pipeline \
            --status failure \
            --branch ${{ github.ref_name }} \
            --commit ${{ github.sha }}

  ai-review:
    name: AI Rule Review
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Get changed rule files
        id: changed
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'rules/**/*.yml' | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
          echo "Changed rules: $CHANGED"

      - name: Run AI review
        id: review
        if: steps.changed.outputs.files != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/ai_review.py \
            --files "${{ steps.changed.outputs.files }}" \
            --output markdown

      - name: Post PR comment
        if: steps.changed.outputs.files != '' && steps.review.outputs.review_comment != ''
        uses: actions/github-script@v7
        env:
          REVIEW_COMMENT: ${{ steps.review.outputs.review_comment }}
        with:
          script: |
            const review = process.env.REVIEW_COMMENT;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            for (const comment of comments.data) {
              if (comment.body.includes('🤖 AI Detection Rule Review')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review,
            });

      - name: No rules changed
        if: steps.changed.outputs.files == ''
        run: echo "No rule files changed — skipping AI review."

  ai-debug:
    name: AI Debug Assistant
    runs-on: ubuntu-latest
    needs: [validate, compile]
    if: failure() && github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Download validate error log
        if: needs.validate.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: validate-errors
          path: /tmp/
        continue-on-error: true

      - name: Download compile error log
        if: needs.compile.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: compile-errors
          path: /tmp/
        continue-on-error: true

      - name: Debug validate failure
        if: needs.validate.result == 'failure'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ERROR=$(cat /tmp/validate_errors.txt 2>/dev/null || echo "No error log captured")
          python3 scripts/ai_debug.py \
            --job validate \
            --error "$ERROR"

      - name: Debug compile failure
        if: needs.compile.result == 'failure'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ERROR=$(cat /tmp/compile_errors.txt 2>/dev/null || echo "No error log captured")
          python3 scripts/ai_debug.py \
            --job compile \
            --error "$ERROR"